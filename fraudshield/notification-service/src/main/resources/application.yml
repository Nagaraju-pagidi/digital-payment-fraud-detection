server:
  port: 8083

spring:
  application:
    name: notification-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/notifications
    username: ${DB_USER:fraud}
    password: ${DB_PASSWORD:fraud123}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
  # Mailpit = fake SMTP server with a web inbox at http://localhost:8025
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000

notification:
  from: alerts@fraudshield.local
  fraud-team: fraud-team@fraudshield.local

# ---- Resilience: what happens when the email server is down ----
resilience4j:
  circuitbreaker:
    instances:
      email:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 6
        minimum-number-of-calls: 4
        failure-rate-threshold: 50          # 50% of the last calls failed -> OPEN (stop trying)
        wait-duration-in-open-state: 30s    # after 30s try again (HALF_OPEN)
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.mail.MailException
  retry:
    instances:
      email:
        max-attempts: 3                     # 3 quick attempts per email
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.mail.MailException

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,retries

logging:
  level:
    com.fraudshield: INFO
