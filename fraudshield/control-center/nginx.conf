server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # All API calls go to the API Gateway container (same origin -> no CORS problems)
    location /api/ {
        proxy_pass http://api-gateway:8060;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # needed for live updates (Server-Sent Events) and slow AI answers
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
